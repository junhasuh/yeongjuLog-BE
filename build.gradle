plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.sonarqube' version '5.0.0.4638'
    id 'jacoco'    
}

group = 'com.yeongju'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2023.0.1")
    set('springCloudAwsVersion', "3.1.1")
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Database
    runtimeOnly 'com.mysql:mysql-connector-j'
    
    // Spring Cloud OpenFeign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    
    // Querydsl
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    
    // API Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    
    // WebClient for async API calls
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    
    // Jackson XML (for Data.go.kr XML parsing)
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    
    // 이미지 처리
    implementation 'commons-io:commons-io:2.11.0'
    
    // AWS S3
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'

    // JWT (카카오 로그인 후 토큰 발급)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'

}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Spring Boot 메인 클래스 지정
springBoot {
    mainClass = 'com.yeongju.YeongjuWelcomeGuideApplication'
}

// Querydsl 설정
def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile) {
    options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

clean {
    delete file(querydslDir)
}

jar {
    enabled = false
}

// JaCoCo 테스트 커버리지 리포트 설정
jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

// ./gradlew test가 끝나면 자동으로 jacocoTestReport가 실행되도록 연결
test {
    finalizedBy jacocoTestReport
}


sonar {
    properties {
        property "sonar.projectKey", "yeongjulog"
        property "sonar.projectName", "yeongjulog"
    }
}