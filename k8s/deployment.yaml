apiVersion: apps/v1
kind: Deployment
metadata:
  name: yeongjulog
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: yeongjulog
  template:
    metadata:
      labels:
        app: yeongjulog
    spec:
      containers:
      - name: app
        image: seojunhayo/yeongjulog:manual
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: yeongju-env
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: yeongjulog
spec:
  type: NodePort
  selector:
    app: yeongjulog
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
